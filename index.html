<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ColorWriter</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6a11cb">

<style id="pgcss"></style><style id="numcss"></style>
<style>
:root{--bg:#f1edf9;--pn:#fff;--tx:#2b1055;--ac:#6a11cb;--bd:#d9c8f5;--ch:#efe8fb}
body.dk{--bg:#1c1530;--pn:#2a2147;--tx:#efe8ff;--ac:#c084fc;--bd:#4a3b78;--ch:#3a2f5e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
#top{background:linear-gradient(90deg,#6a11cb,#e0399b,#ff8a3d);color:#fff;padding:5px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#top b{font-size:16px}
#fn{background:rgba(255,255,255,.22);border:0;color:#fff;padding:5px 9px;border-radius:7px;font-size:14px;width:170px}
.q{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:7px;padding:5px 9px;font-size:15px;cursor:pointer}
#tabs{display:flex;gap:2px;background:var(--pn);padding:4px 8px 0;overflow-x:auto;border-bottom:1px solid var(--bd)}
#tabs button{border:0;background:none;padding:7px 14px;font-size:14px;font-weight:600;color:var(--tx);border-radius:8px 8px 0 0;cursor:pointer}
#tabs button.on{background:var(--ch);color:var(--ac)}
#rib{background:var(--ch);padding:6px 8px;display:flex;gap:4px;overflow-x:auto;align-items:stretch;min-height:76px;border-bottom:2px solid var(--bd)}
.grp{display:flex;flex-direction:column;border-right:1px solid var(--bd);padding:0 6px}
.gi{display:flex;flex-wrap:wrap;gap:3px;align-items:center;flex:1;max-width:430px}
.gl{font-size:10px;text-align:center;opacity:.7;margin-top:2px}
.rb{border:1px solid transparent;background:var(--pn);color:var(--tx);border-radius:7px;padding:3px 6px;min-width:34px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:10px;line-height:1.15}
.rb i{font-style:normal;font-size:16px}
.rb:hover{border-color:var(--ac)}.rb.on{background:var(--ac);color:#fff}
#rib select,#rib input[type=color]{height:28px;border:1px solid var(--bd);border-radius:6px;background:var(--pn);color:var(--tx);font-size:12px}
#rib input[type=color]{width:30px;padding:0}
#main{flex:1;display:flex;min-height:0}
#nav{width:210px;background:var(--pn);border-right:1px solid var(--bd);overflow:auto;padding:8px;font-size:13px;display:none}
#nav a{display:block;padding:4px 6px;border-radius:5px;cursor:pointer}#nav a:hover{background:var(--ch)}
#wrap{flex:1;overflow:auto;padding:14px;touch-action:pan-x pan-y}
#stage{margin:0 auto;transform-origin:top left}
#ruler{height:22px;background:#fff;border:1px solid var(--bd);position:relative;margin-bottom:6px;font-size:9px;color:#555;user-select:none;overflow:hidden}
#ruler .tk{position:absolute;bottom:0;width:1px;background:#888;height:6px}
#ruler .tk.m{height:10px}#ruler .nb{position:absolute;top:1px;transform:translateX(-50%)}
#ruler .gz{position:absolute;top:0;bottom:0;background:#d9d9e8}
#ruler .mk{position:absolute;top:0;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid #e0399b;margin-left:-7px;cursor:ew-resize;touch-action:none}
.page{background:#fff;color:#111;margin:0 auto;box-shadow:0 3px 18px rgba(80,30,140,.3);position:relative}
#doc{outline:none;min-height:300px;font:11pt Arial,sans-serif;line-height:1.15;hyphens:manual;word-wrap:break-word}
#doc p{margin:0 0 8pt}
#doc h1{font-size:20pt;color:#6a11cb;margin:14pt 0 6pt}#doc h2{font-size:16pt;color:#c2185b;margin:12pt 0 4pt}#doc h3{font-size:13pt;color:#0f766e;margin:10pt 0 4pt}#doc h4{font-size:11pt;color:#555;margin:8pt 0 4pt}
#doc .st-title{font-size:26pt;font-weight:700;color:#2b1055}#doc .st-sub{font-size:14pt;color:#777;font-style:italic}
#doc .st-cap{font-size:9pt;color:#666;font-style:italic}#doc .st-ns{margin:0}
#doc blockquote{margin:8pt 30px;padding:4px 12px;border-left:4px solid #e0399b;color:#444;font-style:italic}
#doc pre{font:10pt Consolas,Courier New,monospace;background:#f3f0fa;padding:8px;border-radius:5px;white-space:pre-wrap}
#doc table{border-collapse:collapse;margin:6pt 0;width:100%}
#doc td,#doc th{border:1px solid #888;padding:4px 6px;min-width:20px;vertical-align:top}
#doc table.nob td,#doc table.nob th{border:1px dashed #ddd}
#doc table.ts1 tr:nth-child(even) td{background:#f3e8ff}
#doc table.ts2 tr:first-child td{background:#3b82f6;color:#fff;font-weight:700}
#doc table.ts3 tr:first-child td{background:#e0399b;color:#fff;font-weight:700}#doc table.ts3 tr:nth-child(even) td{background:#ffe3f1}
#doc table.hdr tr:first-child td{font-weight:700}
#doc hr{border:0;border-top:2px solid #999;margin:10px 0}
#doc .pb{border-top:2px dashed #aaa;text-align:center;font-size:10px;color:#888;margin:14px 0;break-after:page;user-select:none}
#doc .pb:after{content:"page break"}
#doc .dc::first-letter{float:left;font-size:3.2em;line-height:.85;padding-right:6px;color:#6a11cb;font-weight:700}
#doc .obj{display:inline-block;resize:both;overflow:hidden;vertical-align:bottom;max-width:100%}
#doc .obj>*{pointer-events:none;width:100%;height:100%;display:block}
#doc .obj.osel{outline:2px dashed #e0399b}
#doc .tbx{position:absolute;border:2px solid #6a11cb;background:rgba(255,255,255,.95);padding:4px;resize:both;overflow:auto;min-width:80px;min-height:40px;z-index:2;border-radius:4px}
#doc .tbh{position:absolute;left:-2px;top:-20px;background:#6a11cb;color:#fff;font-size:12px;padding:1px 7px;border-radius:5px 5px 0 0;cursor:move;touch-action:none;user-select:none}
#doc .tbx-x{position:absolute;right:-2px;top:-20px;background:#ef4444;color:#fff;font-size:12px;padding:1px 7px;border-radius:5px 5px 0 0;cursor:pointer;user-select:none}
#doc .tbc{outline:none;min-height:30px}#doc .tbc p{margin:0}
#doc.marks p:after,#doc.marks h1:after,#doc.marks h2:after,#doc.marks h3:after{content:"¶";color:#e0399b;opacity:.7}
.pgb #doc{border:2px solid #333;padding:8px}
.hf{display:none;color:#666;font-size:10pt;border-bottom:1px dashed #bbb;padding:4px 0;margin-bottom:8px;outline:none;min-height:22px}
#ftr{border-bottom:0;border-top:1px dashed #bbb;margin:8px 0 0}
.wm{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:90px;font-weight:700;color:rgba(150,150,150,.22);transform:rotate(-30deg);pointer-events:none;user-select:none;white-space:nowrap}
#stat{background:#2b1055;color:#fff;font-size:12px;padding:3px 12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#stat input{width:90px}
#dlg{display:none;position:fixed;inset:0;background:rgba(20,10,40,.55);z-index:50;align-items:center;justify-content:center}
#dlg .box{background:var(--pn);color:var(--tx);border-radius:14px;padding:16px;min-width:290px;max-width:94vw;max-height:90vh;overflow:auto}
#dlg h3{margin:0 0 10px;color:var(--ac)}#dlg label{display:flex;justify-content:space-between;gap:10px;margin:6px 0;font-size:14px;align-items:center}
#dlg input,#dlg select{padding:5px;border:1px solid var(--bd);border-radius:6px;background:var(--pn);color:var(--tx);width:140px}
#dlg input[type=checkbox]{width:auto}
#dlg .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#dlg button,.fb button{border:0;border-radius:8px;padding:7px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
#dlg button.gr{background:#888}
.sym{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.sym button{background:var(--ch)!important;color:var(--tx)!important;font-size:18px;padding:5px!important}
#fr{display:none;position:fixed;right:16px;top:130px;z-index:40;background:var(--pn);border:2px solid var(--ac);border-radius:12px;padding:10px;width:280px}
#fr input[type=text]{width:100%;margin:3px 0;padding:6px;border:1px solid var(--bd);border-radius:6px}
.fb{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.fb button{padding:5px 9px;font-size:12px}
@media print{
#top,#tabs,#rib,#stat,#nav,#ruler,#dlg,#fr,.tbh,.tbx-x{display:none!important}
html,body,#main,#wrap{display:block!important;height:auto!important;overflow:visible!important;background:#fff!important;padding:0!important}
#stage{transform:none!important;zoom:1!important;width:auto!important}
.page{width:auto!important;min-height:0!important;padding:0!important;margin:0!important;box-shadow:none!important}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wm{position:fixed;top:40%}#doc .pb{border:0;color:transparent;margin:0}#doc .pb:after{content:""}
#doc .tbx{border-color:#999}
}
</style></head><body>
<div id="top"><b>✎ ColorWriter</b><input id="fn" value="Document1">
<button class="q" onclick="act.save()" title="Save (Ctrl+S)">💾</button><button class="q" onclick="act.undo()" title="Undo">↶</button><button class="q" onclick="act.redo()" title="Redo">↷</button><button class="q" onclick="act.print()" title="Print">🖨</button><button class="q" onclick="act.open()" title="Open">📂</button></div>
<div id="tabs"></div><div id="rib"></div>
<div id="main"><div id="nav"></div><div id="wrap"><div id="stage"><div id="ruler"></div>
<div class="page" id="page"><div class="wm" id="wm"></div><div class="hf" id="hdr" contenteditable="true" data-ph="Header"></div>
<div id="doc" contenteditable="true" spellcheck="true"><p><br></p></div>
<div class="hf" id="ftr" contenteditable="true"></div></div></div></div></div>
<div id="stat"><span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="info"></span><span style="margin-left:auto">Zoom <input type="range" id="zr" min="30" max="300" value="100" oninput="setZoom(this.value/100)"> <b id="zl">100%</b></span></div>
<div id="dlg"></div>
<div id="fr"><b>Find &amp; Replace</b><input type="text" id="fi" placeholder="Find"><input type="text" id="ri" placeholder="Replace with"><label><input type="checkbox" id="fc"> Match case</label>
<div class="fb"><button onclick="act.fnext()">Find next</button><button onclick="act.rep()">Replace</button><button onclick="act.repall()">Replace all</button><button style="background:#888" onclick="$('fr').style.display='none'">Close</button></div></div>
<input type="file" id="fo" hidden accept=".docx,.html,.htm,.txt,.md"><input type="file" id="pi" hidden accept="image/*">
<script>
const $=id=>document.getElementById(id),ed=$('doc'),page=$('page'),stage=$('stage'),wrap=$('wrap'),info=t=>$('info').textContent=t;
let saved=null,Z=1,fh=null,dirty=false,so=null,fp=null,fmtLock=0;

const SIZES=[8,9,10,10.5,11,12,14,16,18,20,22,24,26,28,36,48,72];

document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&(ed.contains(s.anchorNode)||$('hdr').contains(s.anchorNode)||$('ftr').contains(s.anchorNode)))saved=s.getRangeAt(0).cloneRange();requestAnimationFrame(upState)});

function cmd(c,v){rs();document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,v);changed()}
const elOf=()=>{const n=saved&&saved.startContainer;return n&&(n.nodeType===1?n:n.parentElement)};
function blocks(){rs();const s=getSelection();if(!s.rangeCount)return[];const r=s.getRangeAt(0);return[...ed.querySelectorAll(BS)].filter(e=>r.intersectsNode(e)&&!e.querySelector(BS))}
const bset=f=>{blocks().forEach(f);changed()};
function setSize(pt){rs();document.execCommand('styleWithCSS',false,false);document.execCommand('fontSize',false,'7');document.execCommand('styleWithCSS',false,true);
ed.querySelectorAll('font[size="7"]').forEach(f=>{const s=document.createElement('span');s.style.fontSize=pt+'pt';while(f.firstChild)s.appendChild(f.firstChild);f.replaceWith(s)});changed()}
const curPt=()=>{const e=elOf();return e?Math.round(parseFloat(getComputedStyle(e).fontSize)*.75*2)/2:11};
function step(d){const c=curPt();let i=SIZES.findIndex(x=>x>=c);if(d>0)i=SIZES[i]===c?i+1:i;else i=i<=0?0:i-1;setSize(SIZES[Math.max(0,Math.min(SIZES.length-1,i))])}
const rgb2hex=c=>{const m=/(\d+)\D+(\d+)\D+(\d+)/.exec(c);return m?'#'+[m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,'0')).join(''):'#000000'};
function changed(){dirty=true;if(!ed.firstElementChild)ed.innerHTML='<p><br></p>';clearTimeout(changed.t);changed.t=setTimeout(()=>{stats();autosave()},700)}
ed.addEventListener('input',changed);
function stats(){const t=ed.innerText||'',w=(t.match(/\S+/g)||[]).length;$('s1').textContent='Words: '+w;$('s2').textContent='Characters: '+t.replace(/\n/g,'').length;$('s3').textContent='Pages ≈ '+Math.max(1,Math.ceil(page.offsetHeight/SZ[P.size][P.o==='portrait'?1:0]));
const n=$('nav');if(n.style.display==='block'){n.innerHTML='<b>Navigation</b>'+[...ed.querySelectorAll('h1,h2,h3')].map((h,i)=>`<a style="padding-left:${6+(+h.tagName[1]-1)*12}px" data-i="${i}">${h.textContent||'(empty)'}</a>`).join('')}}
$('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a)ed.querySelectorAll('h1,h2,h3')[+a.dataset.i].scrollIntoView({behavior:'smooth',block:'start'})});
/* ---------- page setup, ruler, zoom ---------- */
function applyPage(){let[w,h]=SZ[P.size];if(P.o==='landscape')[w,h]=[h,w];const m=P.m;
page.style.width=w+'px';page.style.minHeight=h+'px';page.style.padding=`${m.t}px ${m.r}px ${m.b}px ${m.l}px`;page.style.background=P.pc;ed.style.columnCount=P.cols>1?P.cols:'auto';ed.style.columnGap='30px';
$('pgcss').textContent=`@page{size:${P.size.toLowerCase()} ${P.o};margin:${m.t}px ${m.r}px ${m.b}px ${m.l}px}`;
$('numcss').textContent=P.num?`@page{@${P.num}{content:counter(page);font-size:10pt}}`:'';

function ruler(w){const r=$('ruler'),m=P.m;let s=`<div class="gz" style="left:0;width:${m.l}px"></div><div class="gz" style="right:0;width:${m.r}px"></div>`;
for(let i=0;i*CM/2<=w;i++){const x=i*CM/2;s+=`<div class="tk${i%2?'':' m'}" style="left:${x}px"></div>`+(i%2?'':`<span class="nb" style="left:${x+8}px">${i/2}</span>`)}
r.style.width=w+'px';r.innerHTML=s+`<div class="mk" data-k="l" style="left:${m.l}px"></div><div class="mk" data-k="r" style="left:${w-m.r}px"></div>`}
let rd=null;$('ruler').addEventListener('pointerdown',e=>{const k=e.target.dataset.k;if(k){rd=k;e.preventDefault()}});
addEventListener('pointermove',e=>{if(!rd)return;const w=page.offsetWidth,x=(e.clientX-$('ruler').getBoundingClientRect().left)/Z;if(rd==='l')P.m.l=Math.round(Math.max(0,Math.min(w-P.m.r-150,x)));else P.m.r=Math.round(Math.max(0,Math.min(w-P.m.l-150,w-x)));applyPage()});
addEventListener('pointerup',()=>{rd=null});
function setZoom(z){Z=Math.max(.3,Math.min(3,Math.round(z*100)/100));stage.style.zoom=Z;$('zl').textContent=Math.round(Z*100)+'%';$('zr').value=Z*100}
wrap.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(Z+(e.deltaY<0?.1:-.1))}},{passive:false});
let pd=0,pz=1;const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
wrap.addEventListener('touchstart',e=>{if(e.touches.length===2){pd=dist(e);pz=Z}},{passive:true});
wrap.addEventListener('touchmove',e=>{if(e.touches.length===2&&pd){e.preventDefault();setZoom(pz*dist(e)/pd)}},{passive:false});wrap.addEventListener('touchend',()=>pd=0);
/* ---------- dialogs ---------- */
function dlg(title,body,ok,okText){const d=$('dlg');d.innerHTML=`<div class="box"><h3>${title}</h3>${body}<div class="bt">${ok?`<button id="dok">${okText||'OK'}</button>`:''}<button id="dcx" class="gr">${ok?'Cancel':'Close'}</button></div></div>`;d.style.display='flex';
$('dcx').onclick=()=>d.style.display='none';if(ok)$('dok').onclick=()=>{const g=i=>{const e=$('d_'+i);return e.type==='checkbox'?e.checked:e.value};if(ok(g)!==false)d.style.display='none'};const f=d.querySelector('input,select');if(f)f.focus()}
const sel_=(id,o,v)=>`<select id="d_${id}">${o.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('')}</select>`;
/* ---------- docx writer (own zip implementation) ---------- */
const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
for(const f of files){const n=enc.encode(f.name),c=crc32(f.data),s=f.data.length;
const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,s,true);h.setUint32(22,s,true);h.setUint16(26,n.length,true);

const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x0800,true);d.setUint16(14,0x21,true);d.setUint32(16,c,true);d.setUint32(20,s,true);d.setUint32(24,s,true);d.setUint16(28,n.length,true);d.setUint32(42,off,true);
cd.push(new Uint8Array(d.buffer),n);off+=30+n.length+s}
const cs=cd.reduce((a,x)=>a+x.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);

async function unzip(buf){const v=new DataView(buf),u=new Uint8Array(buf);let e=u.length-22;while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw Error('Not a valid .docx (zip) file');

for(let i=0;i<n;i++){const meth=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true),name=dec.decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
const ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);out[name]=async()=>{let d=u.subarray(ds,ds+cs);if(meth===8)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());return d}}

const XE=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
